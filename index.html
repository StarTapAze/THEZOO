<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bank Kartları</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f0ede4;
    --paper: #000000;
    --card: #141414;
    --gold: #e3a35c;
    --gold-soft: #242424;
    --line: rgba(240,237,228,0.12);
  }
  :root[data-theme="light"] {
    --ink: #1c1710;
    --paper: #faf6ee;
    --card: #ffffff;
    --gold: #c8863a;
    --gold-soft: #f0dcc0;
    --line: rgba(28,23,16,0.10);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; background: var(--paper); }

  body {
    margin: 0;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 56px 18px 48px;
    padding-top: calc(56px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
  }

  .page {
    width: 100%;
    max-width: 440px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 46px;
    text-align: center;
    margin: 0 0 12px;
    letter-spacing: 0.28em;
    padding-left: 0.28em;
    text-transform: uppercase;
    background: linear-gradient(135deg, var(--gold) 0%, #f6d9a8 50%, var(--gold) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    text-shadow: 0 0 28px rgba(227,163,92,0.25);
  }

  h1::after {
    content: "";
    display: block;
    width: 180px;
    height: 2px;
    margin: 12px auto 0;
    background: var(--gold);
    border-radius: 2px;
    opacity: 0.7;
  }

  .sub {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    text-align: center;
    font-size: 14px;
    margin: 0 0 32px;
    line-height: 1.5;
  }
  .sub .sub-text { opacity: 0.7; }
  .sub svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    color: var(--gold);
    filter: drop-shadow(0 0 6px rgba(227,163,92,0.35));
  }

  .bank-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .bank-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 0;
    transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
  }
  .bank-card:hover { border-color: rgba(227,163,92,0.35); }
  .bank-card.open {
    border-color: rgba(227,163,92,0.55);
    box-shadow: 0 8px 28px rgba(227,163,92,0.10);
  }
  .bank-head:active { transform: scale(0.99); }
  .bank-head:focus-visible { outline: 2px solid var(--gold); outline-offset: 6px; border-radius: 10px; }

  .bank-head {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    font-family: inherit;
    color: var(--ink);
    text-align: left;
  }

  .bank-chevron {
    margin-left: auto;
    width: 18px;
    height: 18px;
    opacity: 0.5;
    transition: transform 0.35s cubic-bezier(.4,0,.2,1), opacity 0.3s ease;
    flex-shrink: 0;
  }
  .bank-card.open .bank-chevron {
    transform: rotate(180deg);
    opacity: 0.9;
    color: var(--gold);
  }

  .bank-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .bank-icon svg {
    width: 22px;
    height: 22px;
  }

  .bank-name {
    font-size: 16px;
    font-weight: 700;
  }

  .card-number-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--paper);
    border: 0 solid var(--line);
    border-radius: 12px;
    padding: 0 14px;
    margin-top: 0;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transform: translateY(-8px) scale(0.98);
    transition: max-height 0.4s cubic-bezier(.4,0,.2,1),
                opacity 0.3s ease,
                margin-top 0.4s cubic-bezier(.4,0,.2,1),
                padding 0.4s cubic-bezier(.4,0,.2,1),
                border-width 0.2s ease,
                transform 0.4s cubic-bezier(.2,.8,.2,1);
  }
  .bank-card.open .card-number-row {
    max-height: 90px;
    opacity: 1;
    margin-top: 12px;
    padding: 12px 14px;
    border-width: 1px;
    transform: none;
  }

  .card-number {
    font-family: 'Courier New', monospace;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 4px;
    word-break: break-all;
    transition: letter-spacing 0.6s cubic-bezier(.2,.8,.2,1);
  }
  .bank-card.open .card-number {
    letter-spacing: 1.2px;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 20px);
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--gold);
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 13.5px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.3s cubic-bezier(.2,.8,.2,1);
    z-index: 10;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  .copy-btn {
    flex-shrink: 0;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--gold);
    background: var(--gold-soft);
    border: none;
    padding: 7px 13px;
    border-radius: 999px;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .copy-btn:hover { opacity: 0.85; transform: translateY(-1px); }
  .copy-btn:active { transform: scale(0.95); }
  .copy-btn.copied { color: #4caf50; }

  footer {
    text-align: center;
    margin-top: 40px;
  }

  .powered-by {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 16px;
    background: var(--gold-soft);
    border: 1px solid var(--gold);
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--gold);
    text-decoration: none;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .powered-by:hover { opacity: 0.85; transform: translateY(-1px); }
  .powered-by svg { width: 16px; height: 16px; }
</style>
</head>
<body>
  <div class="page">

    <!--
      ══════════════════════════════════════════
      REDAKTƏ BURADAN BAŞLAYIR
      Hər kartın nömrəsini (XXXX XXXX XXXX XXXX yazan yeri)
      öz həqiqi kart nömrənlə dəyiş.
      ══════════════════════════════════════════
    -->

    <h1>QARA</h1>
    <p class="sub">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l7.5 3v5.5c0 4.6-3.1 8.2-7.5 9.5-4.4-1.3-7.5-4.9-7.5-9.5V6L12 3z"/>
        <path d="M8.8 12.2l2.4 2.4 4-4.4"/>
      </svg>
      <span class="sub-text">Bu kart məlumatları THE ZOO-ya məxsusdur</span>
    </p>

    <div class="bank-list">

      <!-- ABB -->
      <div class="bank-card">
        <button type="button" class="bank-head" onclick="toggleBank(this)">
          <div class="bank-icon" style="background:#1565C0;">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
              <rect x="2" y="5" width="20" height="14" rx="2.5"/>
              <path d="M2 9.5h20"/>
              <path d="M5.5 14.5h4"/>
            </svg>
          </div>
          <span class="bank-name">ABB</span>
        <svg class="bank-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="card-number-row">
          <span class="card-number" id="card-abb">5522 0993 6882 0940</span>
          <button type="button" class="copy-btn" onclick="copyCard('card-abb', this)">Kopyala</button>
        </div>
      </div>

      <!-- Kapital Bank / Birbank -->
      <div class="bank-card">
        <button type="button" class="bank-head" onclick="toggleBank(this)">
          <div class="bank-icon" style="background:#D32F2F;">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
              <rect x="2" y="5" width="20" height="14" rx="2.5"/>
              <path d="M2 9.5h20"/>
              <path d="M5.5 14.5h4"/>
            </svg>
          </div>
          <span class="bank-name">Kapital Bank (Birbank)</span>
        <svg class="bank-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="card-number-row">
          <span class="card-number" id="card-kapital">4169 7388 8906 5615</span>
          <button type="button" class="copy-btn" onclick="copyCard('card-kapital', this)">Kopyala</button>
        </div>
      </div>


      <!-- Leobank -->
      <div class="bank-card">
        <button type="button" class="bank-head" onclick="toggleBank(this)">
          <div class="bank-icon" style="background:#111111;">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
              <rect x="2" y="5" width="20" height="14" rx="2.5"/>
              <path d="M2 9.5h20"/>
              <path d="M5.5 14.5h4"/>
            </svg>
          </div>
          <span class="bank-name">Leobank</span>
        <svg class="bank-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="card-number-row">
          <span class="card-number" id="card-leo">5411 2498 1245 2410</span>
          <button type="button" class="copy-btn" onclick="copyCard('card-leo', this)">Kopyala</button>
        </div>
      </div>



    </div>

    <!--
      ══════════════════════════════════════════
      REDAKTƏ BURADA BİTİR
      ══════════════════════════════════════════
    -->

    <footer>
      <a class="powered-by" href="https://www.instagram.com/startap.aze?stkn=MWNqbm81aDlzOXM4MA==" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.2" cy="6.8" r="1"/>
        </svg>
        <span>Powered by StarTap.Aze</span>
      </a>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">Kart nömrəsi kopyalandı ✓</div>

  <script>
    function toggleBank(btn) {
      var card = btn.closest('.bank-card');
      card.classList.toggle('open');
    }

    var toastTimer;
    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1800);
    }

    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      return ok;
    }

    function copyCard(id, btn) {
      var text = document.getElementById(id).textContent.trim();
      function done() {
        var original = btn.dataset.label || btn.textContent;
        btn.dataset.label = original;
        btn.textContent = 'Kopyalandı ✓';
        btn.classList.add('copied');
        showToast('Kart nömrəsi kopyalandı ✓');
        setTimeout(function () {
          btn.textContent = original;
          btn.classList.remove('copied');
        }, 1500);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function () {
          if (fallbackCopy(text)) done();
        });
      } else if (fallbackCopy(text)) {
        done();
      }
    }
  </script>
</body>
</html>
